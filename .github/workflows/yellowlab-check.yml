name: yellowlab-check
run-name: ${{ github.actor }} is running Yellow Lab Tools check
on: [workflow_dispatch]

jobs:
  launch-yellowlab-analysis:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 1) Lancement de l'analyse (retourne un runId)
      # Doc: https://github.com/YellowLabTools/YellowLabTools/wiki/Public-API
      - name: Launch Yellow Lab Tools run
        id: launch
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://yellowlab.tools/api/runs'
          method: 'POST'
          contentType: 'application/json'
          data: '{"url":"https://charlenehourdin.github.io/servicepublic/","device":"desktop","waitForResponse":false}'

      - name: Extract runId
        id: run
        run: |
          RUN_ID=$(echo '${{ steps.launch.outputs.response }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['runId'])")
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Yellow Lab Tools runId: $RUN_ID"

      # 2) Attente jusqu'à statut "complete" (polling)
      - name: Wait for analysis
        run: |
          RUN_ID="${{ steps.run.outputs.run_id }}"
          for i in $(seq 1 40); do
            STATUS=$(curl -s "https://yellowlab.tools/api/runs/${RUN_ID}" | python3 -c "import sys,json; print(json.load(sys.stdin)['status']['statusCode'])")
            echo "Attempt $i — status: $STATUS"
            if [ "$STATUS" = "complete" ]; then
              exit 0
            fi
            if [ "$STATUS" = "failed" ]; then
              echo "Yellow Lab Tools run failed"
              curl -s "https://yellowlab.tools/api/runs/${RUN_ID}"
              exit 1
            fi
            sleep 15
          done
          echo "Timeout waiting for Yellow Lab Tools"
          exit 1

      # 3) Récupération du résultat complet
      - name: Get full result
        id: result
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://yellowlab.tools/api/results/${{ steps.run.outputs.run_id }}'
          method: 'GET'

      # 4) Scores synthétiques (plus légers à lire)
      - name: Get general scores
        id: scores
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://yellowlab.tools/api/results/${{ steps.run.outputs.run_id }}/generalScores'
          method: 'GET'

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Store full analysis
        uses: 1arp/create-a-file-action@0.4.6
        with:
          path: 'yellowlab'
          isAbsolutePath: 'false'
          file: yellowlab-analysis-${{ steps.date.outputs.date }}.json
          content: ${{ steps.result.outputs.response }}

      - name: Store general scores
        uses: 1arp/create-a-file-action@0.4.6
        with:
          path: 'yellowlab'
          isAbsolutePath: 'false'
          file: yellowlab-scores-${{ steps.date.outputs.date }}.json
          content: ${{ steps.scores.outputs.response }}

      - name: Auto commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: ajout analyse Yellow Lab Tools ${{ steps.date.outputs.date }}"
