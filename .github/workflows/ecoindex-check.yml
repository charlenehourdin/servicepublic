name: ecoindex-check
run-name: ${{ github.actor }} is running ecoindex check
on: [workflow_dispatch]

jobs:
  launch-ecoindex-analysis:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Analyze all pages with EcoIndex
        id: analyse
        run: |
          set -euo pipefail
          DATE=$(date +'%Y-%m-%d')
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          mkdir -p ecoindex
          rm -f ecoindex/.gitkeep

          # slug|url
          PAGES=(
            "accueil|https://charlenehourdin.github.io/servicepublic/"
            "carte-identite|https://charlenehourdin.github.io/servicepublic/pages/carte-identite/etape-1.html"
          )

          for ENTRY in "${PAGES[@]}"; do
            SLUG="${ENTRY%%|*}"
            PAGE_URL="${ENTRY#*|}"
            echo "::group::EcoIndex — $SLUG ($PAGE_URL)"

            RESP=$(curl -sS -X POST 'https://api.ecoindex.fr/v1/tasks/ecoindexes/' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -d "{\"web_page\": {\"width\": 1920, \"height\": 1080, \"url\": \"${PAGE_URL}\"}}")
            echo "Launch response: $RESP"

            # L'API renvoie souvent l'UUID en JSON string brut ("uuid")
            TASK_ID=$(echo "$RESP" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data if isinstance(data,str) else data.get('id', data))")
            echo "Task ID: $TASK_ID"

            for i in $(seq 1 24); do
              RESULT=$(curl -sS "https://api.ecoindex.fr/v1/tasks/ecoindexes/${TASK_ID}")
              STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))")
              echo "Attempt $i — status: $STATUS"
              if [ "$STATUS" = "SUCCESS" ] || [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "ERROR" ]; then
                break
              fi
              sleep 10
            done

            OUT="ecoindex/ecoindex-analysis-${DATE}-${SLUG}.json"
            echo "$RESULT" | python3 -m json.tool > "$OUT"
            echo "Saved $OUT"
            echo "::endgroup::"
          done

      - name: Auto commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: ajout analyses EcoIndex ${{ steps.analyse.outputs.date }}"
